<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Urgent.ng | On-Demand Errand Marketplace</title>
  <meta name="description" content="Sign in to your Urgent.ng account as a Service Provider or Errand Runner.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <style>
    body {
      background: linear-gradient(135deg, #f4fbe6 0%, #eff1f4 50%, #ffffff 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .auth-header {
      padding: 18px 0;
      border-bottom: 1px solid var(--cn-blue-100);
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
    }
    .auth-header-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .auth-main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      width: 100%;
      max-width: 680px; /* INCREASED MODAL WIDTH */
      background: #ffffff;
      border: 1.5px solid var(--cn-green-200);
      border-radius: var(--radius-xl);
      box-shadow: 0 20px 48px -10px rgba(27, 35, 48, 0.1), 0 4px 16px -2px rgba(147, 199, 0, 0.12);
      padding: 40px;
      position: relative;
    }
    .auth-title-row {
      text-align: center;
      margin-bottom: 24px;
    }
    .auth-title {
      font-size: 28px;
      font-weight: 800;
      color: var(--cn-blue-700);
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .auth-sub {
      font-size: 14px;
      color: var(--cn-blue-500);
    }
    
    /* ROLE SELECTOR */
    .role-choice-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--cn-blue-500);
      margin-bottom: 10px;
      display: block;
      text-align: center;
    }
    .role-selector-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-bottom: 22px;
    }
    .role-card-btn {
      padding: 16px 14px;
      background: var(--cn-blue-50);
      border: 2px solid var(--cn-blue-100);
      border-radius: var(--radius-lg);
      cursor: pointer;
      text-align: left;
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-family: inherit;
    }
    .role-card-btn:hover {
      border-color: var(--cn-green-300);
      background: var(--cn-green-50);
    }
    .role-card-btn.active {
      background: #ffffff;
      border-color: var(--cn-green-500);
      box-shadow: 0 0 0 3px rgba(147, 199, 0, 0.2);
    }
    .role-card-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .role-icon {
      font-size: 22px;
    }
    .role-radio-dot {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid var(--cn-blue-200);
      background: #ffffff;
    }
    .role-card-btn.active .role-radio-dot {
      border-color: var(--cn-green-500);
      background: var(--cn-green-500);
    }
    .role-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--cn-blue-700);
    }
    .role-card-btn.active .role-name {
      color: var(--cn-green-900);
    }
    .role-desc {
      font-size: 12px;
      color: var(--cn-blue-400);
      line-height: 1.35;
    }

    .active-role-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--cn-green-50);
      border: 1px solid var(--cn-green-200);
      border-radius: var(--radius-md);
      padding: 9px 14px;
      margin-bottom: 22px;
      font-size: 12px;
      font-weight: 600;
      color: var(--cn-green-900);
    }

    .auth-form-group {
      margin-bottom: 18px;
    }
    .auth-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--cn-blue-700);
      margin-bottom: 6px;
    }
    .auth-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }
    .auth-input-wrapper svg.field-icon {
      position: absolute;
      left: 14px;
      color: var(--cn-blue-400);
      pointer-events: none;
    }
    .auth-input {
      width: 100%;
      height: 48px;
      padding: 0 44px;
      background: var(--cn-white);
      border: 1.5px solid var(--cn-blue-100);
      border-radius: var(--radius-md);
      font-family: inherit;
      font-size: 14px;
      color: var(--cn-blue-700);
      transition: all var(--transition-fast);
    }
    .auth-input:focus {
      outline: none;
      border-color: var(--cn-green-500);
      box-shadow: 0 0 0 3px rgba(147, 199, 0, 0.2);
    }
    .password-toggle-btn {
      position: absolute;
      right: 12px;
      background: none;
      border: none;
      color: var(--cn-blue-400);
      cursor: pointer;
      padding: 4px;
      display: flex;
      align-items: center;
    }
    .password-toggle-btn:hover {
      color: var(--cn-blue-700);
    }
    .auth-meta-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      font-size: 13px;
    }
    .remember-label {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--cn-blue-600);
      cursor: pointer;
    }
    .forgot-link {
      color: var(--cn-green-700);
      font-weight: 600;
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }

    .btn-auth-submit {
      width: 100%;
      height: 50px;
      font-size: 15px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .demo-credentials-box {
      margin-top: 22px;
      padding: 14px;
      background: var(--cn-blue-50);
      border: 1px dashed var(--cn-blue-200);
      border-radius: var(--radius-md);
      text-align: center;
    }
    .demo-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--cn-blue-500);
      margin-bottom: 8px;
    }
    .demo-buttons-row {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-demo-fill {
      background: #ffffff;
      border: 1px solid var(--cn-blue-200);
      border-radius: var(--radius-sm);
      padding: 6px 14px;
      font-size: 12px;
      font-weight: 600;
      color: var(--cn-blue-600);
      cursor: pointer;
      transition: all var(--transition-fast);
      font-family: inherit;
    }
    .btn-demo-fill:hover {
      background: var(--cn-green-50);
      color: var(--cn-green-900);
      border-color: var(--cn-green-400);
    }

    .auth-card-footer {
      margin-top: 24px;
      text-align: center;
      font-size: 13px;
      color: var(--cn-blue-500);
    }
    .auth-card-footer a {
      color: var(--cn-green-700);
      font-weight: 700;
      text-decoration: none;
    }
    .auth-card-footer a:hover {
      text-decoration: underline;
    }

    /* GOOGLE PHONE NUMBER MODAL / STEP VIEW */
    .google-phone-view {
      display: none;
      animation: fadeIn 200ms ease;
    }
    .google-phone-view.active {
      display: block;
    }

    /* SUCCESS STATE OVERLAY */
    .auth-success-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255, 255, 255, 0.98);
      border-radius: var(--radius-xl);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 36px;
      text-align: center;
      animation: fadeIn 200ms ease;
    }
    .auth-success-overlay.active {
      display: flex;
    }
    .success-icon-box {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: var(--cn-green-100);
      color: var(--cn-green-700);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.97); }
      to { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Top Header Navigation -->
  <header class="auth-header">
    <div class="container auth-header-inner">
      <a href="index.html" class="brand-logo" style="display:flex; justify-content:center;">
        <img src="assets/logo.png" alt="Urgent.ng - Get it fast" class="brand-logo-img" style="height:46px; max-width:180px; object-fit:contain;">
      </a>

      <div style="display:flex; align-items:center; gap:12px;">
        <a href="index.html" class="btn btn-outline btn-sm">
          &larr; Back to Home
        </a>
      </div>
    </div>
  </header>

  <!-- Main Login Card Container -->
  <main class="auth-main">
    <div class="auth-card">

      <!-- ================= VIEW 1: REGULAR LOGIN & GOOGLE AUTH ================= -->
      <div id="standardLoginView">
        <div class="auth-title-row">
          <h1 class="auth-title">Welcome to Urgent.ng</h1>
          <p class="auth-sub">Choose your account type to continue</p>
        </div>

        <!-- Role Selection Cards -->
        <label class="role-choice-label">Step 1: Select Your Role</label>
        <div class="role-selector-grid">
          <button type="button" class="role-card-btn active" id="btnRoleProvider" onclick="setLoginRole('provider')">
            <div class="role-card-top">
              <span class="role-icon">💼</span>
              <div class="role-radio-dot"></div>
            </div>
            <div class="role-name">Service Provider</div>
            <div class="role-desc">Post tasks & hire local runners</div>
          </button>

          <button type="button" class="role-card-btn" id="btnRoleRunner" onclick="setLoginRole('runner')">
            <div class="role-card-top">
              <span class="role-icon">🏃</span>
              <div class="role-radio-dot"></div>
            </div>
            <div class="role-name">Errand Runner</div>
            <div class="role-desc">Find tasks nearby & earn daily</div>
          </button>
        </div>

        <!-- Google Auth CTA Button -->
        <button type="button" class="btn-google-auth" onclick="startGoogleAuthFlow()">
          <svg class="google-icon" width="20" height="20" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
          </svg>
          <span id="googleBtnText">Continue with Google as Service Provider</span>
        </button>

        <div class="auth-divider">
          <span>or sign in with email / phone</span>
        </div>

        <!-- Standard Login Form -->
        <form id="loginForm" onsubmit="handleLoginSubmit(event)">
          <div class="auth-form-group">
            <label class="auth-label" for="loginIdentifier" id="identifierLabel">Email Address or Phone Number</label>
            <div class="auth-input-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <input type="text" id="loginIdentifier" class="auth-input" placeholder="e.g. adeleke@business.ng or 0802 345 6789" required autocomplete="username">
            </div>
          </div>

          <div class="auth-form-group">
            <label class="auth-label" for="loginPassword">Password</label>
            <div class="auth-input-wrapper">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" class="field-icon">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
              <input type="password" id="loginPassword" class="auth-input" placeholder="••••••••••••" required autocomplete="current-password">
              <button type="button" class="password-toggle-btn" onclick="togglePasswordVisibility()" aria-label="Toggle password visibility">
                <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                  <circle cx="12" cy="12" r="3"></circle>
                </svg>
              </button>
            </div>
          </div>

          <div class="auth-meta-row">
            <label class="remember-label">
              <input type="checkbox" id="rememberMe" checked>
              <span>Remember this device</span>
            </label>
            <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
          </div>

          <button type="submit" class="btn btn-primary btn-auth-submit" id="submitBtn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
            <span id="submitBtnText">Log In as Service Provider</span>
          </button>

          <div class="demo-credentials-box">
            <div class="demo-title">⚡ Quick Demo Test Fill</div>
            <div class="demo-buttons-row">
              <button type="button" class="btn-demo-fill" onclick="fillDemoCredentials('provider')">
                👔 Demo Provider (Adeleke Boutique)
              </button>
              <button type="button" class="btn-demo-fill" onclick="fillDemoCredentials('runner')">
                🏃 Demo Runner (Tunde - Lekki Bike)
              </button>
            </div>
          </div>

          <div class="auth-card-footer">
            Don't have an account yet? <a href="register.html">Create an Account</a>
          </div>
        </form>
      </div>

      <!-- ================= SUCCESS OVERLAY ================= -->
      <div class="auth-success-overlay" id="successOverlay">
        <div class="success-icon-box">
          <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"></polyline></svg>
        </div>
        <h3 style="font-size:22px; font-weight:800; color:var(--cn-blue-700); margin-bottom:8px;" id="successTitle">Welcome Back!</h3>
        <p style="font-size:14px; color:var(--cn-blue-500); max-width:400px; margin-bottom:24px;" id="successMsg">
          You are now securely logged in.
        </p>
        <div style="display:flex; gap:12px; width:100%; max-width:380px;">
          <a href="discovery.html" class="btn btn-primary btn-lg" style="flex:1; justify-content:center;">
            Go to Discovery Feed &rarr;
          </a>
          <button type="button" class="btn btn-outline btn-lg" style="flex:1;" onclick="resetLoginForm()">
            Log Out
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    let activeRole = 'provider'; // 'provider' or 'runner'

    function setLoginRole(role) {
      activeRole = role;
      const btnProvider = document.getElementById('btnRoleProvider');
      const btnRunner = document.getElementById('btnRoleRunner');
      const bannerText = document.getElementById('roleBannerText');
      const submitText = document.getElementById('submitBtnText');
      const googleBtnText = document.getElementById('googleBtnText');
      const identInput = document.getElementById('loginIdentifier');
      const identLabel = document.getElementById('identifierLabel');

      if (role === 'provider') {
        btnProvider.classList.add('active');
        btnRunner.classList.remove('active');
        if (bannerText) bannerText.innerHTML = 'Logging in as: <strong>Service Provider / Requester</strong>';
        submitText.textContent = 'Log In as Service Provider';
        googleBtnText.textContent = 'Continue with Google as Service Provider';
        identLabel.textContent = 'Business Email or Phone Number';
        identInput.placeholder = 'e.g. contact@adelekeboutique.ng or 0802 345 6789';
      } else {
        btnRunner.classList.add('active');
        btnProvider.classList.remove('active');
        if (bannerText) bannerText.innerHTML = 'Logging in as: <strong>Errand Runner</strong>';
        submitText.textContent = 'Log In as Errand Runner';
        googleBtnText.textContent = 'Continue with Google as Errand Runner';
        identLabel.textContent = 'Registered Phone Number or Email';
        identInput.placeholder = 'e.g. 0808 123 4567 or tunde.runner@gmail.com';
      }
    }

    function togglePasswordVisibility() {
      const pwdInput = document.getElementById('loginPassword');
      const eyeIcon = document.getElementById('eyeIcon');
      if (pwdInput.type === 'password') {
        pwdInput.type = 'text';
        eyeIcon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        pwdInput.type = 'password';
        eyeIcon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    function fillDemoCredentials(role) {
      setLoginRole(role);
      const identInput = document.getElementById('loginIdentifier');
      const pwdInput = document.getElementById('loginPassword');

      if (role === 'provider') {
        identInput.value = 'emmanuella.adeleke@boutique.ng';
        pwdInput.value = 'LagosStore2026!';
      } else {
        identInput.value = '0808 555 9182 (Tunde Okon)';
        pwdInput.value = 'FastBikeRunner99!';
      }
    }

    function handleLoginSubmit(e) {
      e.preventDefault();
      const overlay = document.getElementById('successOverlay');
      const successTitle = document.getElementById('successTitle');
      const successMsg = document.getElementById('successMsg');

      const userProfile = {
        role: activeRole,
        name: activeRole === 'provider' ? 'Emmanuella Adeleke' : 'Tunde Okon',
        phone: activeRole === 'provider' ? '0802 345 6789' : '0808 555 9182',
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('urgent_user', JSON.stringify(userProfile));

      if (activeRole === 'provider') {
        successTitle.textContent = 'Welcome, Service Provider!';
        successMsg.textContent = 'Signed in successfully. Routing to your Requester Dashboard...';
      } else {
        successTitle.textContent = 'Welcome, Errand Runner!';
        successMsg.textContent = 'Signed in successfully. Routing to your Runner Dashboard...';
      }

      overlay.classList.add('active');
      setTimeout(() => {
        window.location.href = activeRole === 'provider' ? 'requester-dashboard.html' : 'runner-dashboard.html';
      }, 1000);
    }

    // ================= GOOGLE AUTH WORKFLOW =================
    // Users signing in with Google do NOT have to provide their phone number
    function startGoogleAuthFlow() {
      const overlay = document.getElementById('successOverlay');
      const successTitle = document.getElementById('successTitle');
      const successMsg = document.getElementById('successMsg');

      const isProvider = activeRole === 'provider';
      const userProfile = {
        role: activeRole,
        name: isProvider ? 'Adeleke Boutique' : 'Tunde Okon',
        email: isProvider ? 'adeleke.business@gmail.com' : 'tunde.okon.runner@gmail.com',
        authMethod: 'google',
        loginTime: new Date().toISOString()
      };
      localStorage.setItem('urgent_user', JSON.stringify(userProfile));

      if (isProvider) {
        successTitle.textContent = 'Signed In with Google!';
        successMsg.textContent = 'Welcome back, Adeleke Boutique! Routing to your Requester Dashboard...';
      } else {
        successTitle.textContent = 'Signed In with Google!';
        successMsg.textContent = 'Welcome back, Tunde Okon! Routing to your Runner Dashboard...';
      }

      overlay.classList.add('active');
      setTimeout(() => {
        window.location.href = isProvider ? 'requester-dashboard.html' : 'runner-dashboard.html';
      }, 1000);
    }

    function resetLoginForm() {
      document.getElementById('successOverlay').classList.remove('active');
      document.getElementById('standardLoginView').style.display = 'block';
    }
  </script>
</body>
</html>
